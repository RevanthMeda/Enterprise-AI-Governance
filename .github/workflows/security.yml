name: Security

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  security:
    name: Security Gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      NODE_ENV: test
      SESSION_SECRET: ci-test-session-secret-000000000000000000000000
      CONTROL_TOWER_VAULT_SECRET: ci-test-vault-secret-000000000000000000000000
      RATE_LIMIT_HMAC_SECRET: ci-test-rate-limit-secret-0000000000000000000000
      PASSWORD_RESET_SECRET: ci-test-password-reset-secret-00000000000000000000
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static checks
        run: npm run security:sast

      - name: OpenAPI lint
        run: npm run openapi:lint

      - name: CSP header smoke test
        run: npm run test:security:csp

      - name: Production dependency audit
        run: npm run security:deps

      - name: Full dependency audit
        continue-on-error: true
        run: npm run security:deps:all

      - name: Secret scan
        run: npm run security:secrets

      - name: Generate SBOM
        run: npm run security:sbom

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v6
        with:
          name: sbom
          path: sbom.cdx.json

      - name: Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: |
            p/owasp-top-ten
            p/nodejs
            p/secrets
