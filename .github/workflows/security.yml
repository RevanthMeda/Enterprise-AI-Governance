name: Security

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  security:
    name: Security Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    env:
      NODE_ENV: test
      SESSION_SECRET: ci-test-session-secret-000000000000000000000000
      CONTROL_TOWER_VAULT_SECRET: ci-test-vault-secret-000000000000000000000000
      RATE_LIMIT_HMAC_SECRET: ci-test-rate-limit-secret-0000000000000000000000
      PASSWORD_RESET_SECRET: ci-test-password-reset-secret-00000000000000000000
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static checks
        run: npm run security:sast

      - name: OpenAPI lint
        run: npm run openapi:lint

      - name: CSP header smoke test
        run: npm run test:security:csp

      - name: Production dependency audit
        run: npm run security:deps

      - name: Full dependency audit
        continue-on-error: true
        run: npm run security:deps:all

      - name: Secret scan
        run: npm run security:secrets

      - name: Generate SBOM
        run: npm run security:sbom

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom.cdx.json

      - name: Install pinned Semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/python" -m pip install --disable-pip-version-check -r script/requirements-semgrep.txt
          echo "$RUNNER_TEMP/semgrep-venv/bin" >> "$GITHUB_PATH"

      - name: Validate Semgrep fail-closed behavior
        run: |
          npm run test:ci:semgrep
          npm run test:ci:semgrep:integration

      - name: Semgrep
        id: semgrep
        run: node script/semgrep-gate.mjs "$RUNNER_TEMP/semgrep-summary.json"

      - name: Upload sanitized Semgrep summary
        if: always() && steps.semgrep.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-summary
          path: ${{ runner.temp }}/semgrep-summary.json
          if-no-files-found: error
          retention-days: 7
