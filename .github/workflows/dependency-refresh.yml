name: Temporary dependency refresh

on:
  push:
    branches:
      - chore/oss-foundation

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/oss-foundation
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Refresh vulnerable dependency resolutions
        run: |
          npm audit fix --package-lock-only || true
          npm audit --audit-level=high || true

      - name: Commit lockfile refresh
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo "No dependency metadata changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          git commit -m "chore: refresh vulnerable dependency resolutions"
          git push origin HEAD:chore/oss-foundation
