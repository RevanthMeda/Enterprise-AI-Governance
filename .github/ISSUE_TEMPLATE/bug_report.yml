name: Bug report
description: Report a reproducible problem in AI CONTROL GRID
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve AI CONTROL GRID. Please remove secrets, customer data, and personal information before submitting.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible sequence.
      placeholder: |
        1. Start...
        2. Configure...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, deployment mode, database, browser, and relevant commit/release.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or additional evidence
      description: Redact all credentials, tokens, organization data, and personal information.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets and sensitive data.
          required: true
