services:
  postgres:
    image: postgres:16
    container_name: ai-control-grid-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: enterprise_ai_governance
    ports:
      - "5432:5432"
    volumes:
      - ai_control_grid_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enterprise_ai_governance"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  ai_control_grid_postgres:
